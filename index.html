<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedcubing Timer - CSTimer Pro Style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #f43f5e;
            --success: #22c55e;
            --holding-color: #fbbf24;
            --ready-color: #22c55e;
            --inspect-color: #f97316;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 1.5rem;
            border-bottom: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            height: 60px;
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .brand span { color: var(--accent); }

        .header-controls {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .select-dropdown {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
        }

        .select-dropdown:hover { border-color: var(--accent); }

        .btn-action {
            background: #334155;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn-action:hover { background: #475569; }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .toggle-container input { display: none; }

        .switch {
            width: 36px;
            height: 20px;
            background-color: #334155;
            border-radius: 20px;
            position: relative;
            transition: background-color 0.2s;
        }

        .switch::after {
            content: '';
            position: absolute;
            top: 2px; left: 2px;
            width: 16px; height: 16px;
            border-radius: 50%;
            background-color: #fff;
            transition: transform 0.2s;
        }

        .toggle-container input:checked + .switch { background-color: var(--accent); }
        .toggle-container input:checked + .switch::after { transform: translateX(16px); }

        /* Main Layout */
        .app-container {
            display: grid;
            grid-template-columns: 340px 1fr;
            flex: 1;
            height: calc(100vh - 60px);
        }

        /* Left Sidebar History */
        .sidebar {
            background: var(--card-bg);
            border-right: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 0.75rem;
            overflow-y: auto;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--card-border);
        }

        .history-title {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }
        .clear-btn:hover { text-decoration: underline; }

        /* Sidebar Stats (Lượt, Best, Ao5, Ao12 text-only) */
        .sidebar-stats {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--card-border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .sidebar-stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
        }

        .sidebar-stat-row span {
            color: var(--accent);
            font-weight: 700;
        }

        .solves-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex: 1;
            overflow-y: auto;
        }

        .solve-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            padding: 0.45rem 0.65rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .solve-index {
            color: var(--text-muted);
            width: 26px;
            font-size: 0.7rem;
        }

        .solve-time {
            font-weight: 700;
            color: var(--text-main);
            flex: 1;
            cursor: pointer;
        }
        .solve-time.dnf { color: var(--danger); text-decoration: line-through; }
        .solve-time.plus2 { color: var(--holding-color); }

        .solve-actions {
            display: flex;
            gap: 0.25rem;
        }

        .action-badge {
            background: #334155;
            border: none;
            color: var(--text-muted);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
        }
        .action-badge.active { background: var(--accent); color: #0f172a; }

        .remove-solve {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            margin-left: 0.15rem;
            font-size: 0.8rem;
        }
        .remove-solve:hover { color: var(--danger); }

        /* Timer Section */
        .timer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 2rem;
            position: relative;
        }

        .scramble-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 0.9rem 1.5rem;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-align: center;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }
        .scramble-box:hover { border-color: var(--accent); }

        .timer-display-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .inspection-status {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--inspect-color);
            height: 24px;
            margin-bottom: 0.2rem;
            letter-spacing: 1px;
        }

        .timer-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 6rem;
            font-weight: 800;
            color: var(--text-main);
            transition: color 0.1s ease;
            line-height: 1;
        }

        .timer-display.holding { color: var(--holding-color); }
        .timer-display.ready { color: var(--ready-color); }
        .timer-display.inspecting { color: var(--inspect-color); }

        /* Remaining Stats Grid (Ao50, Mean) */
        .stats-grid-inline {
            display: grid;
            grid-template-columns: repeat(2, minmax(100px, 120px));
            gap: 0.75rem;
            margin-top: 1.75rem;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.5rem 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .stat-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent);
            margin-top: 0.15rem;
        }

        .timer-hint {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 1.25rem;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 1.75rem;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.1rem;
            text-align: center;
        }

        .modal-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
        }

        .modal-scramble {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
            width: 100%;
        }

        .modal-btn {
            background: #334155;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.6rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.1s;
        }
        .modal-btn:hover { background: #475569; }
        .modal-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
        .modal-btn.btn-dnf.active { background: var(--danger); color: #fff; border-color: var(--danger); }

        .modal-ok {
            background: var(--accent);
            color: #0f172a;
            grid-column: span 3;
        }
        .modal-ok:hover { opacity: 0.9; }

        .manual-input {
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            padding: 0.5rem;
            border-radius: 6px;
            width: 100%;
            text-align: center;
            outline: none;
        }
        .manual-input:focus { border-color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            ⚡ CSTimer <span>Pro</span>
        </div>
        <div class="header-controls">
            <!-- Event Selector -->
            <select class="select-dropdown" id="eventSelect" onchange="changeEvent()">
                <option value="333">3x3x3 Cube</option>
                <option value="222">2x2x2 Cube</option>
                <option value="pyram">Pyraminx</option>
                <option value="skewb">Skewb</option>
            </select>

            <!-- Session Selector -->
            <select class="select-dropdown" id="sessionSelect" onchange="changeSession()">
                <option value="Session 1">Session 1</option>
                <option value="Session 2">Session 2</option>
                <option value="Session 3">Session 3</option>
            </select>

            <button class="btn-action" onclick="openManualModal()">+ Nhập tay</button>
            <button class="btn-action" onclick="exportData()" title="Xuất dữ liệu ra file JSON">Xuất JSON</button>
            <button class="btn-action" onclick="triggerImport()" title="Nhập dữ liệu từ file JSON">Nhập JSON</button>
            <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="handleFileImport(event)">

            <label class="toggle-container">
                <span>Xem đề 15s</span>
                <input type="checkbox" id="inspectionToggle">
                <span class="switch"></span>
            </label>
        </div>
    </header>

    <div class="app-container">
        <!-- Left Sidebar History -->
        <div class="sidebar">
            <div class="history-header">
                <span class="history-title" id="historyTitle">Lịch sử (0)</span>
                <button class="clear-btn" onclick="clearHistory()">Xóa session</button>
            </div>

            <!-- Sidebar Stats (Lượt, Best, Ao5, Ao12 text-only) -->
            <div class="sidebar-stats">
                <div class="sidebar-stat-row">
                    <span>Lượt giải:</span>
                    <span id="statCount">0</span>
                </div>
                <div class="sidebar-stat-row">
                    <span>Best (PB):</span>
                    <span id="statPB">--</span>
                </div>
                <div class="sidebar-stat-row">
                    <span>Ao5:</span>
                    <span id="statAo5">--</span>
                </div>
                <div class="sidebar-stat-row">
                    <span>Ao12:</span>
                    <span id="statAo12">--</span>
                </div>
            </div>

            <div class="solves-list" id="solvesList"></div>
        </div>

        <!-- Main Timer Area -->
        <div class="timer-section" id="timerSection">
            <div class="scramble-box" id="scrambleDisplay" title="Nhấn để đổi scramble khác" onclick="newScramble()">---</div>

            <div class="timer-display-wrapper">
                <div class="inspection-status" id="inspectionStatus"></div>
                <div class="timer-display" id="timerDisplay">0.000</div>

                <!-- Remaining Stats Grid (Ao50, Mean) -->
                <div class="stats-grid-inline">
                    <div class="stat-card">
                        <span class="stat-label">Ao50</span>
                        <span class="stat-value" id="statAo50">--</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Mean</span>
                        <span class="stat-value" id="statMean">--</span>
                    </div>
                </div>

                <div class="timer-hint">Nhấn giữ SPACE hoặc chạm màn hình để bắt đầu</div>
            </div>
        </div>
    </div>

    <!-- Result Modal Popup -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-scramble" id="modalScramble">R U R' U'...</div>
            <div class="modal-time" id="modalTime">0.000</div>
            <div class="modal-buttons">
                <button class="modal-btn" id="modalBtnPlus2" onclick="setModalPenalty(2)">+2s</button>
                <button class="modal-btn" id="modalBtnDNF" onclick="setModalPenalty('DNF')">DNF</button>
                <button class="modal-btn" onclick="deleteModalSolve()" style="color: var(--danger);">Xóa</button>
                <button class="modal-btn modal-ok" onclick="closeModal()">OK</button>
            </div>
        </div>
    </div>

    <!-- Manual Entry Modal -->
    <div class="modal-overlay" id="manualModal">
        <div class="modal-card">
            <h3>Nhập thời gian thủ công</h3>
            <input type="text" class="manual-input" id="manualTimeInput" placeholder="Ví dụ: 12.34 hoặc 1:12.34">
            <div class="modal-buttons">
                <button class="modal-btn modal-ok" onclick="submitManualSolve()">Thêm lượt giải</button>
            </div>
            <button class="clear-btn" onclick="closeManualModal()" style="margin-top: 0.5rem;">Hủy</button>
        </div>
    </div>

    <script>
        let state = 'IDLE';
        let inspectionEnabled = false;
        let inspectionTimer = null;
        let inspectionStartTime = 0;
        let timerInterval = null;
        let startTime = 0;
        let holdingTimeout = null;
        let currentRawTime = 0;
        let inspectionPenalty = 0;

        let currentEvent = '333';
        let currentSession = 'Session 1';

        let allData = JSON.parse(localStorage.getItem('cstimer_pro_data') || '{}');
        if (!allData[currentSession]) allData[currentSession] = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq = 600, duration = 0.15) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(osc.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const timerDisplay = document.getElementById('timerDisplay');
        const scrambleDisplay = document.getElementById('scrambleDisplay');
        const inspectionStatus = document.getElementById('inspectionStatus');
        const inspectionToggle = document.getElementById('inspectionToggle');
        const solvesList = document.getElementById('solvesList');
        const historyTitle = document.getElementById('historyTitle');

        const resultModal = document.getElementById('resultModal');
        const modalTime = document.getElementById('modalTime');
        const modalScramble = document.getElementById('modalScramble');
        const modalBtnPlus2 = document.getElementById('modalBtnPlus2');
        const modalBtnDNF = document.getElementById('modalBtnDNF');

        const manualModal = document.getElementById('manualModal');
        const manualTimeInput = document.getElementById('manualTimeInput');

        inspectionToggle.addEventListener('change', (e) => { inspectionEnabled = e.target.checked; });

        function changeEvent() {
            currentEvent = document.getElementById('eventSelect').value;
            newScramble();
        }

        function changeSession() {
            currentSession = document.getElementById('sessionSelect').value;
            if (!allData[currentSession]) allData[currentSession] = [];
            saveAndRender();
            newScramble();
        }

        // Export and Import JSON Functions
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `speedcubing_timer_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function triggerImport() {
            document.getElementById('importFileInput').click();
        }

        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (typeof imported === 'object' && imported !== null) {
                        if (confirm("Bạn có muốn ghi đè dữ liệu hiện tại bằng file backup này không?")) {
                            allData = imported;
                            if (!allData[currentSession]) {
                                currentSession = Object.keys(allData)[0] || 'Session 1';
                                document.getElementById('sessionSelect').value = currentSession;
                            }
                            saveAndRender();
                            alert("Nhập dữ liệu thành công!");
                        }
                    } else {
                        alert("File JSON không hợp lệ!");
                    }
                } catch (err) {
                    alert("Lỗi khi đọc file JSON: " + err.message);
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function generateScramble() {
            if (currentEvent === '333') {
                const moves = ["R", "L", "U", "D", "F", "B"];
                const mods = ["", "'", "2"];
                let scramble = [], lastAxis = -1;
                for (let i = 0; i < 20; i++) {
                    let mIdx, axis;
                    do {
                        mIdx = Math.floor(Math.random() * moves.length);
                        axis = Math.floor(mIdx / 2);
                    } while (axis === lastAxis);
                    lastAxis = axis;
                    scramble.push(moves[mIdx] + mods[Math.floor(Math.random() * mods.length)]);
                }
                return scramble.join(" ");
            } else if (currentEvent === '222') {
                const moves = ["R", "U", "F"];
                const mods = ["", "'", "2"];
                let scramble = [], lastMove = "";
                for (let i = 0; i < 10; i++) {
                    let mv;
                    do { mv = moves[Math.floor(Math.random() * moves.length)]; } while (mv === lastMove);
                    lastMove = mv;
                    scramble.push(mv + mods[Math.floor(Math.random() * mods.length)]);
                }
                return scramble.join(" ");
            } else if (currentEvent === 'pyram') {
                const moves = ["U", "L", "R", "B"];
                const mods = ["", "'"];
                const tips = ["u", "l", "r", "b"];
                let scramble = [];
                for (let i = 0; i < 8; i++) {
                    scramble.push(moves[Math.floor(Math.random() * moves.length)] + mods[Math.floor(Math.random() * mods.length)]);
                }
                tips.forEach(t => {
                    if (Math.random() > 0.5) scramble.push(t + (Math.random() > 0.5 ? "'" : ""));
                });
                return scramble.join(" ");
            } else if (currentEvent === 'skewb') {
                const moves = ["R", "L", "U", "B"];
                const mods = ["", "'"];
                let scramble = [];
                for (let i = 0; i < 9; i++) {
                    scramble.push(moves[Math.floor(Math.random() * moves.length)] + mods[Math.floor(Math.random() * mods.length)]);
                }
                return scramble.join(" ");
            }
        }

        function newScramble() {
            scrambleDisplay.innerText = generateScramble();
        }

        function formatTime(ms, penalty = 0) {
            if (penalty === 'DNF') return 'DNF';
            if (penalty === 2) ms += 2000;
            
            let totalSec = ms / 1000;
            let mins = Math.floor(totalSec / 60);
            let secs = (totalSec % 60).toFixed(2);
            if (secs < 10) secs = '0' + secs;
            
            let result = (mins > 0 ? mins + ':' + (secs < 10 ? '0' : '') : '') + secs;
            if (penalty === 2) result += '+';
            return result;
        }

        function handleKeyDown() {
            if (resultModal.classList.contains('active') || manualModal.classList.contains('active')) return;

            if (state === 'RUNNING') {
                stopTimer();
            } else if (state === 'IDLE' || state === 'STOPPED') {
                timerDisplay.className = 'timer-display holding';
                state = 'HOLDING';
                holdingTimeout = setTimeout(() => {
                    timerDisplay.className = 'timer-display ready';
                    state = 'READY';
                    playBeep(800, 0.1);
                }, 500);
            }
        }

        function handleKeyUp() {
            if (resultModal.classList.contains('active') || manualModal.classList.contains('active')) return;

            if (state === 'HOLDING') {
                clearTimeout(holdingTimeout);
                timerDisplay.className = 'timer-display';
                state = 'IDLE';
            } else if (state === 'READY') {
                if (inspectionEnabled) {
                    state = 'INSPECTING';
                    inspectionStartTime = Date.now();
                    inspectionStatus.innerText = 'Inspection: 0s';
                    timerDisplay.className = 'timer-display inspecting';
                    inspectionPenalty = 0;
                    
                    inspectionTimer = setInterval(() => {
                        let elapsed = Math.floor((Date.now() - inspectionStartTime) / 1000);
                        if (elapsed < 8) {
                            inspectionStatus.innerText = `Inspection: ${elapsed}s`;
                        } else if (elapsed < 12) {
                            inspectionStatus.innerText = `Inspection: ${elapsed}s (Warning)`;
                            if (elapsed === 8) playBeep(500, 0.1);
                        } else if (elapsed < 15) {
                            inspectionStatus.innerText = `Inspection: ${elapsed}s (+2)`;
                            inspectionPenalty = 2;
                        } else {
                            inspectionStatus.innerText = 'Inspection: DNF';
                            inspectionPenalty = 'DNF';
                            clearInterval(inspectionTimer);
                        }
                    }, 1000);
                } else {
                    startTimer();
                }
            } else if (state === 'INSPECTING') {
                clearInterval(inspectionTimer);
                inspectionStatus.innerText = '';
                startTimer();
            }
        }

        function startTimer() {
            state = 'RUNNING';
            timerDisplay.className = 'timer-display';
            startTime = Date.now();
            timerInterval = setInterval(() => {
                let diff = Date.now() - startTime;
                timerDisplay.innerText = formatTime(diff);
            }, 10);
        }

        function stopTimer() {
            state = 'STOPPED';
            clearInterval(timerInterval);
            let rawTime = Date.now() - startTime;
            currentRawTime = rawTime;

            let finalPenalty = 0;
            if (inspectionEnabled && inspectionPenalty !== 0) {
                finalPenalty = inspectionPenalty;
            }

            const newSolve = {
                id: Date.now(),
                rawTime: rawTime,
                penalty: finalPenalty,
                scramble: scrambleDisplay.innerText
            };

            if (!allData[currentSession]) allData[currentSession] = [];
            allData[currentSession].unshift(newSolve);
            saveAndRender();

            state = 'IDLE';
            newScramble();
            openModal(newSolve);
        }

        function openModal(solve) {
            modalTime.innerText = formatTime(solve.rawTime, solve.penalty);
            modalScramble.innerText = solve.scramble;
            updateModalButtonsState();
            resultModal.classList.add('active');
        }

        function closeModal() { resultModal.classList.remove('active'); }

        function setModalPenalty(type) {
            let solves = allData[currentSession];
            if (solves.length === 0) return;
            solves[0].penalty = solves[0].penalty === type ? 0 : type;
            saveAndRender();
            modalTime.innerText = formatTime(solves[0].rawTime, solves[0].penalty);
            updateModalButtonsState();
        }

        function deleteModalSolve() {
            let solves = allData[currentSession];
            if (solves.length === 0) return;
            solves.shift();
            saveAndRender();
            closeModal();
        }

        function updateModalButtonsState() {
            let solves = allData[currentSession];
            if (solves.length === 0) return;
            const latest = solves[0];
            modalBtnPlus2.className = `modal-btn ${latest.penalty === 2 ? 'active' : ''}`;
            modalBtnDNF.className = `modal-btn btn-dnf ${latest.penalty === 'DNF' ? 'active' : ''}`;
        }

        function togglePenalty(index, penaltyType) {
            let solves = allData[currentSession];
            solves[index].penalty = solves[index].penalty === penaltyType ? 0 : penaltyType;
            saveAndRender();
        }

        function removeSolve(index) {
            allData[currentSession].splice(index, 1);
            saveAndRender();
        }

        function clearHistory() {
            if (confirm(`Bạn có chắc muốn xóa sạch lịch sử của [${currentSession}]?`)) {
                allData[currentSession] = [];
                saveAndRender();
            }
        }

        function openManualModal() {
            manualTimeInput.value = '';
            manualModal.classList.add('active');
            manualTimeInput.focus();
        }
        function closeManualModal() { manualModal.classList.remove('active'); }

        function submitManualSolve() {
            let val = manualTimeInput.value.trim();
            let ms = 0;
            if (val.includes(':')) {
                let parts = val.split(':');
                ms = (parseInt(parts[0]) * 60 + parseFloat(parts[1])) * 1000;
            } else {
                ms = parseFloat(val) * 1000;
            }

            if (isNaN(ms) || ms <= 0) {
                alert("Thời gian không hợp lệ!");
                return;
            }

            const newSolve = {
                id: Date.now(),
                rawTime: ms,
                penalty: 0,
                scramble: scrambleDisplay.innerText
            };

            if (!allData[currentSession]) allData[currentSession] = [];
            allData[currentSession].unshift(newSolve);
            saveAndRender();
            closeManualModal();
            newScramble();
        }

        function calculateAverage(solveGroup) {
            if (solveGroup.some(s => s.penalty === 'DNF')) {
                const dnfCount = solveGroup.filter(s => s.penalty === 'DNF').length;
                if (dnfCount > 1) return 'DNF';
            }
            let mapped = solveGroup.map(s => {
                if (s.penalty === 'DNF') return Infinity;
                if (s.penalty === 2) return s.rawTime + 2000;
                return s.rawTime;
            });
            mapped.sort((a, b) => a - b);
            let trimmed = mapped.slice(1, mapped.length - 1);
            if (trimmed.includes(Infinity)) return 'DNF';
            const sum = trimmed.reduce((acc, val) => acc + val, 0);
            return sum / trimmed.length;
        }

        function calculateMean(solveGroup) {
            if (solveGroup.some(s => s.penalty === 'DNF')) return 'DNF';
            const sum = solveGroup.reduce((acc, s) => acc + s.rawTime + (s.penalty === 2 ? 2000 : 0), 0);
            return sum / solveGroup.length;
        }

        function updateStats() {
            let solves = allData[currentSession] || [];
            historyTitle.innerText = `Lịch sử (${solves.length})`;
            document.getElementById('statCount').innerText = solves.length;

            const validSolves = solves.filter(s => s.penalty !== 'DNF');
            if (validSolves.length > 0) {
                let best = Math.min(...validSolves.map(s => s.rawTime + (s.penalty === 2 ? 2000 : 0)));
                document.getElementById('statPB').innerText = formatTime(best);
            } else {
                document.getElementById('statPB').innerText = '--';
            }

            document.getElementById('statAo5').innerText = solves.length >= 5 && typeof calculateAverage(solves.slice(0, 5)) === 'number' ? formatTime(calculateAverage(solves.slice(0, 5))) : (solves.length >= 5 ? 'DNF' : '--');
            document.getElementById('statAo12').innerText = solves.length >= 12 && typeof calculateAverage(solves.slice(0, 12)) === 'number' ? formatTime(calculateAverage(solves.slice(0, 12))) : (solves.length >= 12 ? 'DNF' : '--');
            document.getElementById('statAo50').innerText = solves.length >= 50 && typeof calculateAverage(solves.slice(0, 50)) === 'number' ? formatTime(calculateAverage(solves.slice(0, 50))) : (solves.length >= 50 ? 'DNF' : '--');
            document.getElementById('statMean').innerText = solves.length > 0 && typeof calculateMean(solves) === 'number' ? formatTime(calculateMean(solves)) : (solves.length > 0 ? 'DNF' : '--');
        }

        function renderHistory() {
            solvesList.innerHTML = '';
            let solves = allData[currentSession] || [];
            solves.forEach((solve, index) => {
                const item = document.createElement('div');
                item.className = 'solve-item';
                
                let timeStr = formatTime(solve.rawTime, solve.penalty);
                let penaltyClass = '';
                if (solve.penalty === 'DNF') penaltyClass = 'dnf';
                else if (solve.penalty === 2) penaltyClass = 'plus2';

                item.innerHTML = `
                    <span class="solve-index">#${solves.length - index}</span>
                    <span class="solve-time ${penaltyClass}" onclick="togglePenalty(${index}, 2)">${timeStr}</span>
                    <div class="solve-actions">
                        <button class="action-badge ${solve.penalty === 2 ? 'active' : ''}" onclick="togglePenalty(${index}, 2)">+2</button>
                        <button class="action-badge ${solve.penalty === 'DNF' ? 'active' : ''}" onclick="togglePenalty(${index}, 'DNF')">DNF</button>
                        <button class="remove-solve" onclick="removeSolve(${index})">×</button>
                    </div>
                `;
                solvesList.appendChild(item);
            });
        }

        function saveAndRender() {
            localStorage.setItem('cstimer_pro_data', JSON.stringify(allData));
            renderHistory();
            updateStats();
        }

        window.addEventListener('keydown', (e) => {
            if (resultModal.classList.contains('active')) {
                if (e.code === 'Space' || e.code === 'Enter') {
                    e.preventDefault();
                    closeModal();
                }
                return;
            }

            if (manualModal.classList.contains('active')) return;

            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                handleKeyDown();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (resultModal.classList.contains('active') || manualModal.classList.contains('active')) return;
            if (e.code === 'Space') {
                e.preventDefault();
                handleKeyUp();
            }
        });

        const timerSection = document.getElementById('timerSection');
        timerSection.addEventListener('touchstart', (e) => {
            if (resultModal.classList.contains('active') || manualModal.classList.contains('active')) return;
            e.preventDefault();
            handleKeyDown();
        }, { passive: false });

        timerSection.addEventListener('touchend', (e) => {
            if (resultModal.classList.contains('active') || manualModal.classList.contains('active')) return;
            e.preventDefault();
            handleKeyUp();
        }, { passive: false });

        newScramble();
        saveAndRender();
    </script>
</body>
</html>
