 <!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedcubing Timer Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --ready-color: #22c55e;
      --holding-color: #ef4444;
      --inspect-color: #eab308;
      --danger: #f43f5e;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 2rem;
      border-bottom: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      height: 60px;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand span { color: var(--accent); }

    .controls-bar {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .toggle-container input { display: none; }

    .switch {
      width: 42px;
      height: 24px;
      background-color: #334155;
      border-radius: 20px;
      position: relative;
      transition: background-color 0.2s;
    }

    .switch::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background-color: #fff;
      transition: transform 0.2s;
    }

    .toggle-container input:checked + .switch { background-color: var(--accent); }
    .toggle-container input:checked + .switch::after { transform: translateX(18px); }

    .app-container {
      display: grid;
      grid-template-columns: 360px 1fr;
      flex: 1;
      height: calc(100vh - 60px);
    }

    .timer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2rem;
      position: relative;
    }

    .scramble-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1rem 2rem;
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-align: center;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .timer-display-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
    }

    .inspection-status {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--inspect-color);
      height: 25px;
      margin-bottom: 0.25rem;
      letter-spacing: 1px;
    }

    .timer-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 6.5rem;
      font-weight: 800;
      color: var(--text-main);
      transition: color 0.1s ease;
      line-height: 1;
    }

    .timer-display.holding { color: var(--holding-color); }
    .timer-display.ready { color: var(--ready-color); }
    .timer-display.inspecting { color: var(--inspect-color); }

    .stats-grid-inline {
      display: grid;
      grid-template-columns: repeat(3, minmax(110px, 140px));
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: 0.2rem;
    }

    .timer-hint {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 1.5rem;
    }

    .sidebar {
      background: var(--card-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      gap: 1rem;
      overflow-y: auto;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    .history-title {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .solves-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
      overflow-y: auto;
    }

    .solve-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }

    .solve-index {
      color: var(--text-muted);
      width: 28px;
      font-size: 0.75rem;
    }

    .solve-time {
      font-weight: 600;
      flex: 1;
    }

    .solve-actions {
      display: flex;
      gap: 0.3rem;
    }

    .action-badge {
      background: #334155;
      border: none;
      color: var(--text-muted);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    .action-badge.plus2-active { background: var(--warning); color: #000; }
    .action-badge.dnf-active { background: var(--danger); color: #fff; }

    .remove-solve {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      margin-left: 0.2rem;
      font-size: 0.85rem;
    }
    .remove-solve:hover { color: var(--danger); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2rem;
      width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      text-align: center;
    }

    .modal-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 4rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }

    .modal-scramble {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .modal-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      width: 100%;
    }

    .modal-btn {
      background: #334155;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.1s;
    }
    .modal-btn:hover { background: #475569; }

    .modal-btn.btn-plus2.active {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--warning);
      color: var(--warning);
    }

    .modal-btn.btn-dnf.active {
      background: rgba(244, 63, 94, 0.25);
      border-color: var(--danger);
      color: var(--danger);
    }

    .modal-btn.btn-delete:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    .modal-ok {
      background: var(--accent);
      color: #0f172a;
      grid-column: span 3;
      margin-top: 0.25rem;
    }
    .modal-ok:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚡ Speedcubing<span>Timer</span></div>
    <div class="controls-bar">
      <label class="toggle-container">
        <span>Xem đề 15s (Inspection)</span>
        <input type="checkbox" id="inspectionToggle">
        <span class="switch"></span>
      </label>
    </div>
  </header>

  <div class="app-container">
    <div class="sidebar">
      <div class="history-header">
        <span class="history-title" id="historyTitle">Lịch sử (0 lượt)</span>
        <button class="clear-btn" onclick="clearHistory()">Xóa tất cả</button>
      </div>
      <div class="solves-list" id="solvesList"></div>
    </div>

    <div class="timer-section" id="timerSection">
      <div class="scramble-box" id="scrambleDisplay">---</div>

      <div class="timer-display-wrapper">
        <div class="inspection-status" id="inspectionStatus"></div>
        <div class="timer-display" id="timerDisplay">0.000</div>
        
        <div class="stats-grid-inline">
          <div class="stat-card">
            <span class="stat-label">Best (PB)</span>
            <span class="stat-value" id="statPB">--</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Ao5</span>
            <span class="stat-value" id="statAo5">--</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Ao12</span>
            <span class="stat-value" id="statAo12">--</span>
          </div>
        </div>

        <div class="timer-hint" id="timerHint">Nhấn giữ SPACE hoặc chạm màn hình để bắt đầu</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="resultModal">
    <div class="modal-card">
      <div class="modal-scramble" id="modalScramble">R U R' U'...</div>
      <div class="modal-time" id="modalTime">12.345</div>
      <div class="modal-buttons">
        <button class="modal-btn btn-plus2" id="modalBtnPlus2" onclick="setModalPenalty(2)">+2s</button>
        <button class="modal-btn btn-dnf" id="modalBtnDNF" onclick="setModalPenalty('DNF')">DNF</button>
        <button class="modal-btn btn-delete" onclick="deleteModalSolve()">Xóa</button>
        <button class="modal-btn modal-ok" onclick="closeModal()">Tiếp tục (Enter)</button>
      </div>
    </div>
  </div>

  <script>
    let state = 'IDLE';
    let inspectionEnabled = false;
    let inspectionTimeLeft = 15;
    let inspectionInterval = null;
    let holdingTimeout = null;
    let timerInterval = null;
    let startTime = 0;
    let currentRawTime = 0;
    let inspectionPenalty = 0;

    let solves = JSON.parse(localStorage.getItem('rubik_solves') || '[]');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 600, duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    const timerDisplay = document.getElementById('timerDisplay');
    const inspectionStatus = document.getElementById('inspectionStatus');
    const scrambleDisplay = document.getElementById('scrambleDisplay');
    const inspectionToggle = document.getElementById('inspectionToggle');
    const solvesList = document.getElementById('solvesList');
    const historyTitle = document.getElementById('historyTitle');
    const resultModal = document.getElementById('resultModal');
    const modalTime = document.getElementById('modalTime');
    const modalScramble = document.getElementById('modalScramble');
    const modalBtnPlus2 = document.getElementById('modalBtnPlus2');
    const modalBtnDNF = document.getElementById('modalBtnDNF');

    inspectionToggle.addEventListener('change', (e) => {
      inspectionEnabled = e.target.checked;
    });

    function generateScramble() {
      const moves = ["R", "L", "U", "D", "F", "B"];
      const modifiers = ["", "'", "2"];
      const scramble = [];
      let lastAxis = -1;

      for (let i = 0; i < 20; i++) {
        let moveIndex, axis;
        do {
          moveIndex = Math.floor(Math.random() * moves.length);
          axis = Math.floor(moveIndex / 2);
        } while (axis === lastAxis);

        lastAxis = axis;
        const modifier = modifiers[Math.floor(Math.random() * modifiers.length)];
        scramble.push(moves[moveIndex] + modifier);
      }
      return scramble.join(" ");
    }

    function newScramble() { scrambleDisplay.innerText = generateScramble(); }

    function formatTime(ms, penalty = 0) {
      if (penalty === 'DNF') return 'DNF';
      let totalMs = ms + (penalty === 2 ? 2000 : 0);
      const seconds = Math.floor(totalMs / 1000);
      const remainderMs = Math.floor(totalMs % 1000);
      const minutes = Math.floor(seconds / 60);
      const displaySec = seconds % 60;

      let str = '';
      if (minutes > 0) {
        str = `${minutes}:${displaySec < 10 ? '0' : ''}${displaySec}.${remainderMs.toString().padStart(3, '0')}`;
      } else {
        str = `${displaySec}.${remainderMs.toString().padStart(3, '0')}`;
      }
      if (penalty === 2) str += ' (+2)';
      return str;
    }

    function startInspection() {
      state = 'INSPECTING';
      inspectionTimeLeft = 15;
      inspectionPenalty = 0;
      inspectionStatus.innerText = 'INSPECTION';
      timerDisplay.innerText = '15';
      timerDisplay.className = 'timer-display inspecting';

      inspectionInterval = setInterval(() => {
        inspectionTimeLeft--;
        if (inspectionTimeLeft === 7) playBeep(800);
        if (inspectionTimeLeft === 3) playBeep(1000);

        if (inspectionTimeLeft > 0) {
          timerDisplay.innerText = inspectionTimeLeft;
        } else if (inspectionTimeLeft > -2) {
          inspectionPenalty = 2;
          inspectionStatus.innerText = '+2 SECONDS';
          timerDisplay.innerText = '+2';
        } else {
          inspectionPenalty = 'DNF';
          inspectionStatus.innerText = 'DNF';
          timerDisplay.innerText = 'DNF';
          clearInterval(inspectionInterval);
        }
      }, 1000);
    }

    function handleKeyDown() {
      if (resultModal.classList.contains('active')) return;

      if (state === 'RUNNING') {
        stopTimer();
        return;
      }

      if (state === 'IDLE') {
        if (inspectionEnabled) {
          startInspection();
        } else {
          state = 'HOLDING';
          timerDisplay.className = 'timer-display holding';
          holdingTimeout = setTimeout(() => {
            state = 'READY';
            timerDisplay.className = 'timer-display ready';
          }, 300);
        }
        return;
      }

      if (state === 'INSPECTING') {
        state = 'HOLDING';
        timerDisplay.className = 'timer-display holding';
        holdingTimeout = setTimeout(() => {
          state = 'READY';
          timerDisplay.className = 'timer-display ready';
        }, 300);
      }
    }

    function handleKeyUp() {
      if (resultModal.classList.contains('active')) return;

      if (state === 'HOLDING') {
        clearTimeout(holdingTimeout);
        state = inspectionEnabled ? 'INSPECTING' : 'IDLE';
        timerDisplay.className = inspectionEnabled ? 'timer-display inspecting' : 'timer-display';
      } else if (state === 'READY') {
        if (inspectionInterval) clearInterval(inspectionInterval);
        inspectionStatus.innerText = '';
        startTimer();
      }
    }

    function startTimer() {
      state = 'RUNNING';
      startTime = performance.now();
      timerDisplay.className = 'timer-display';
      timerInterval = setInterval(() => {
        currentRawTime = performance.now() - startTime;
        timerDisplay.innerText = formatTime(currentRawTime);
      }, 10);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      currentRawTime = performance.now() - startTime;
      
      const newSolve = {
        id: Date.now(),
        rawTime: currentRawTime,
        penalty: inspectionPenalty,
        scramble: scrambleDisplay.innerText
      };

      solves.unshift(newSolve);
      saveAndRender();
      
      state = 'IDLE';
      timerDisplay.innerText = '0.000';
      newScramble();
      
      openModal(newSolve);
    }

    function openModal(solve) {
      modalTime.innerText = formatTime(solve.rawTime, solve.penalty);
      modalScramble.innerText = solve.scramble;
      updateModalButtonsState();
      resultModal.classList.add('active');
    }

    function closeModal() { resultModal.classList.remove('active'); }

    function setModalPenalty(type) {
      if (solves.length === 0) return;
      solves[0].penalty = solves[0].penalty === type ? 0 : type;
      saveAndRender();
      modalTime.innerText = formatTime(solves[0].rawTime, solves[0].penalty);
      updateModalButtonsState();
    }

    function deleteModalSolve() {
      if (solves.length === 0) return;
      solves.shift();
      saveAndRender();
      closeModal();
    }

    function updateModalButtonsState() {
      if (solves.length === 0) return;
      const latest = solves[0];
      modalBtnPlus2.className = `modal-btn btn-plus2 ${latest.penalty === 2 ? 'active' : ''}`;
      modalBtnDNF.className = `modal-btn btn-dnf ${latest.penalty === 'DNF' ? 'active' : ''}`;
    }

    function togglePenalty(index, penaltyType) {
      solves[index].penalty = solves[index].penalty === penaltyType ? 0 : penaltyType;
      saveAndRender();
    }

    function removeSolve(index) {
      solves.splice(index, 1);
      saveAndRender();
    }

    function clearHistory() {
      if (confirm("Bạn có chắc chắn muốn xóa tất cả lịch sử giải?")) {
        solves = [];
        saveAndRender();
      }
    }

    function calculateAverage(solveGroup) {
      if (solveGroup.some(s => s.penalty === 'DNF')) {
        const dnfCount = solveGroup.filter(s => s.penalty === 'DNF').length;
        if (dnfCount > 1) return 'DNF';
      }
      const times = solveGroup.map(s => s.penalty === 'DNF' ? Infinity : s.rawTime + (s.penalty === 2 ? 2000 : 0));
      times.sort((a, b) => a - b);
      const trimmed = times.slice(1, -1);
      const sum = trimmed.reduce((acc, curr) => acc + curr, 0);
      return sum / trimmed.length;
    }

    function updateStats() {
      historyTitle.innerText = `Lịch sử (${solves.length} lượt)`;

      const validSolves = solves.filter(s => s.penalty !== 'DNF');
      if (validSolves.length > 0) {
        const best = Math.min(...validSolves.map(s => s.rawTime + (s.penalty === 2 ? 2000 : 0)));
        document.getElementById('statPB').innerText = formatTime(best);
      } else {
        document.getElementById('statPB').innerText = '--';
      }

      if (solves.length >= 5) {
        const ao5 = calculateAverage(solves.slice(0, 5));
        document.getElementById('statAo5').innerText = typeof ao5 === 'number' ? formatTime(ao5) : 'DNF';
      } else {
        document.getElementById('statAo5').innerText = '--';
      }

      if (solves.length >= 12) {
        const ao12 = calculateAverage(solves.slice(0, 12));
        document.getElementById('statAo12').innerText = typeof ao12 === 'number' ? formatTime(ao12) : 'DNF';
      } else {
        document.getElementById('statAo12').innerText = '--';
      }
    }

    function renderHistory() {
      solvesList.innerHTML = '';
      solves.forEach((solve, index) => {
        const item = document.createElement('div');
        item.className = 'solve-item';
        item.innerHTML = `
          <span class="solve-index">#${solves.length - index}</span>
          <span class="solve-time">${formatTime(solve.rawTime, solve.penalty)}</span>
          <div class="solve-actions">
            <button class="action-badge ${solve.penalty === 2 ? 'plus2-active' : ''}" onclick="togglePenalty(${index}, 2)">+2</button>
            <button class="action-badge ${solve.penalty === 'DNF' ? 'dnf-active' : ''}" onclick="togglePenalty(${index}, 'DNF')">DNF</button>
            <button class="remove-solve" onclick="removeSolve(${index})">✕</button>
          </div>
        `;
        solvesList.appendChild(item);
      });
    }

    function saveAndRender() {
      localStorage.setItem('rubik_solves', JSON.stringify(solves));
      renderHistory();
      updateStats();
    }

    window.addEventListener('keydown', (e) => {
      if (resultModal.classList.contains('active')) {
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          closeModal();
        } else if (e.key === '2') {
          setModalPenalty(2);
        } else if (e.key.toLowerCase() === 'd') {
          setModalPenalty('DNF');
        } else if (e.code === 'Delete' || e.code === 'Backspace') {
          deleteModalSolve();
        }
        return;
      }

      if (e.code === 'Space' && !e.repeat) {
        e.preventDefault();
        handleKeyDown();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (resultModal.classList.contains('active')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        handleKeyUp();
      }
    });

    const timerSection = document.getElementById('timerSection');
    timerSection.addEventListener('touchstart', (e) => {
      if (resultModal.classList.contains('active')) return;
      e.preventDefault();
      handleKeyDown();
    }, { passive: false });

    timerSection.addEventListener('touchend', (e) => {
      if (resultModal.classList.contains('active')) return;
      e.preventDefault();
      handleKeyUp();
    }, { passive: false });

    newScramble();
    saveAndRender();
  </script>
</body>
</html>
