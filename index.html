<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedcubing Timer - CSTimer Pro Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --ready-color: #22c55e;
      --holding-color: #ef4444;
      --inspect-color: #eab308;
      --danger: #f43f5e;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1.5rem;
      border-bottom: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      height: 60px;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .brand span { color: var(--accent); }

    .header-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .select-dropdown {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    .select-dropdown:hover { border-color: var(--accent); }

    .btn-action {
      background: #334155;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.1s;
    }
    .btn-action:hover { background: #475569; }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .toggle-container input { display: none; }

    .switch {
      width: 36px;
      height: 20px;
      background-color: #334155;
      border-radius: 20px;
      position: relative;
      transition: background-color 0.2s;
    }

    .switch::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background-color: #fff;
      transition: transform 0.2s;
    }

    .toggle-container input:checked + .switch { background-color: var(--accent); }
    .toggle-container input:checked + .switch::after { transform: translateX(16px); }

    /* Main Layout */
    .app-container {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      height: calc(100vh - 60px);
    }

    /* Left Sidebar History */
    .sidebar {
      background: var(--card-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.75rem;
      overflow-y: auto;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    .history-title {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .clear-btn {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .solves-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 1;
      overflow-y: auto;
    }

    .solve-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 6px;
      padding: 0.45rem 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }

    .solve-index {
      color: var(--text-muted);
      width: 26px;
      font-size: 0.7rem;
    }

    .solve-time {
      font-weight: 600;
      flex: 1;
    }

    .solve-actions {
      display: flex;
      gap: 0.25rem;
    }

    .action-badge {
      background: #334155;
      border: none;
      color: var(--text-muted);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
    }

    .action-badge.plus2-active { background: var(--warning); color: #000; }
    .action-badge.dnf-active { background: var(--danger); color: #fff; }

    .remove-solve {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      margin-left: 0.15rem;
      font-size: 0.8rem;
    }
    .remove-solve:hover { color: var(--danger); }

    /* Timer Section */
    .timer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2rem;
      position: relative;
    }

    .scramble-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.9rem 1.5rem;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-align: center;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .timer-display-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
    }

    .inspection-status {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--inspect-color);
      height: 24px;
      margin-bottom: 0.2rem;
      letter-spacing: 1px;
    }

    .timer-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 6rem;
      font-weight: 800;
      color: var(--text-main);
      transition: color 0.1s ease;
      line-height: 1;
    }

    .timer-display.holding { color: var(--holding-color); }
    .timer-display.ready { color: var(--ready-color); }
    .timer-display.inspecting { color: var(--inspect-color); }

    /* CSTimer Stats Grid (2 rows for flexibility) */
    .stats-grid-inline {
      display: grid;
      grid-template-columns: repeat(6, minmax(85px, 110px));
      gap: 0.5rem;
      margin-top: 1.75rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.5rem 0.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .stat-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: 0.15rem;
    }

    .timer-hint {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 1.25rem;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.75rem;
      width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      text-align: center;
    }

    .modal-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }

    .modal-scramble {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .modal-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      width: 100%;
    }

    .modal-btn {
      background: #334155;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.6rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.1s;
    }
    .modal-btn:hover { background: #475569; }

    .modal-btn.btn-plus2.active {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--warning);
      color: var(--warning);
    }

    .modal-btn.btn-dnf.active {
      background: rgba(244, 63, 94, 0.25);
      border-color: var(--danger);
      color: var(--danger);
    }

    .modal-btn.btn-delete:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    .modal-ok {
      background: var(--accent);
      color: #0f172a;
      grid-column: span 3;
    }
    .modal-ok:hover { opacity: 0.9; }

    .manual-input {
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      padding: 0.5rem;
      border-radius: 6px;
      width: 100%;
      text-align: center;
      outline: none;
    }
    .manual-input:focus { border-color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      ⚡ CSTimer<span>Pro</span>
    </div>
    <div class="header-controls">
      <!-- Event Selector -->
      <select class="select-dropdown" id="eventSelect" onchange="changeEvent()">
        <option value="333">3x3x3 Cube</option>
        <option value="222">2x2x2 Cube</option>
        <option value="pyram">Pyraminx</option>
        <option value="skewb">Skewb</option>
      </select>

      <!-- Session Selector -->
      <select class="select-dropdown" id="sessionSelect" onchange="changeSession()">
        <option value="Session 1">Session 1</option>
        <option value="Session 2">Session 2</option>
        <option value="Session 3">Session 3</option>
      </select>

      <button class="btn-action" onclick="openManualModal()">+ Nhập tay</button>

      <label class="toggle-container">
        <span>Xem đề 15s</span>
        <input type="checkbox" id="inspectionToggle">
        <span class="switch"></span>
      </label>
    </div>
  </header>

  <div class="app-container">
    <!-- Left Sidebar History -->
    <div class="sidebar">
      <div class="history-header">
        <span class="history-title" id="historyTitle">Lịch sử (0)</span>
        <button class="clear-btn" onclick="clearHistory()">Xóa session</button>
      </div>
      <div class="solves-list" id="solvesList"></div>
    </div>

    <!-- Main Timer Area -->
    <div class="timer-section" id="timerSection">
      <div class="scramble-box" id="scrambleDisplay" onclick="newScramble()" title="Nhấn để đổi scramble khác">---</div>

      <div class="timer-display-wrapper">
        <div class="inspection-status" id="inspectionStatus"></div>
        <div class="timer-display" id="timerDisplay">0.000</div>
        
        <!-- CSTimer Stats Grid (6 items) -->
        <div class="stats-grid-inline">
          <div class="stat-card">
            <span class="stat-label">Lượt</span>
            <span class="stat-value" id="statCount">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Best</span>
            <span class="stat-value" id="statPB">--</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Ao5</span>
            <span class="stat-value" id="statAo5">--</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Ao12</span>
            <span class="stat-value" id="statAo12">--</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Ao50</span>
            <span class="stat-value" id="statAo50">--</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Mean</span>
            <span class="stat-value" id="statMean">--</span>
          </div>
        </div>

        <div class="timer-hint">Nhấn giữ SPACE hoặc chạm màn hình để bắt đầu</div>
      </div>
    </div>
  </div>

  <!-- Result Modal Popup -->
  <div class="modal-overlay" id="resultModal">
    <div class="modal-card">
      <div class="modal-scramble" id="modalScramble">R U R' U'...</div>
      <div class="modal-time" id="modalTime">12.345</div>
      <div class="modal-buttons">
        <button class="modal-btn btn-plus2" id="modalBtnPlus2" onclick="setModalPenalty(2)">+2s</button>
        <button class="modal-btn btn-dnf" id="modalBtnDNF" onclick="setModalPenalty('DNF')">DNF</button>
        <button class="modal-btn btn-delete" onclick="deleteModalSolve()">Xóa</button>
        <button class="modal-btn modal-ok" onclick="closeModal()">Tiếp tục (Enter)</button>
      </div>
    </div>
  </div>

  <!-- Manual Entry Modal -->
  <div class="modal-overlay" id="manualModal">
    <div class="modal-card">
      <h3>Nhập thời gian thủ công</h3>
      <input type="text" class="manual-input" id="manualTimeInput" placeholder="Ví dụ: 12.34 hoặc 1:12.34">
      <div class="modal-buttons">
        <button class="modal-btn modal-ok" onclick="submitManualSolve()" style="grid-column: span 3;">Thêm lượt giải</button>
      </div>
      <button class="clear-btn" onclick="closeManualModal()" style="margin-top: 0.5rem;">Hủy</button>
    </div>
  </div>

  <script>
    let state = 'IDLE';
    let inspectionEnabled = false;
    let inspectionTimeLeft = 15;
    let inspectionInterval = null;
    let holdingTimeout = null;
    let timerInterval = null;
    let startTime = 0;
    let currentRawTime = 0;
    let inspectionPenalty = 0;

    let currentEvent = '333';
    let currentSession = 'Session 1';
    
    // Lưu trữ database session dưới localStorage
    let allData = JSON.parse(localStorage.getItem('cstimer_pro_data') || '{}');
    if (!allData[currentSession]) allData[currentSession] = [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 600, duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    const timerDisplay = document.getElementById('timerDisplay');
    const inspectionStatus = document.getElementById('inspectionStatus');
    const scrambleDisplay = document.getElementById('scrambleDisplay');
    const inspectionToggle = document.getElementById('inspectionToggle');
    const solvesList = document.getElementById('solvesList');
    const historyTitle = document.getElementById('historyTitle');
    
    const resultModal = document.getElementById('resultModal');
    const modalTime = document.getElementById('modalTime');
    const modalScramble = document.getElementById('modalScramble');
    const modalBtnPlus2 = document.getElementById('modalBtnPlus2');
    const modalBtnDNF = document.getElementById('modalBtnDNF');
    
    const manualModal = document.getElementById('manualModal');
    const manualTimeInput = document.getElementById('manualTimeInput');

    inspectionToggle.addEventListener('change', (e) => { inspectionEnabled = e.target.checked; });

    function changeEvent() {
      currentEvent = document.getElementById('eventSelect').value;
      newScramble();
    }

    function changeSession() {
      currentSession = document.getElementById('sessionSelect').value;
      if (!allData[currentSession]) allData[currentSession] = [];
      saveAndRender();
      newScramble();
    }

    // Scramble Generator chuẩn cho các môn
    function generateScramble() {
      if (currentEvent === '333') {
        const moves = ["R", "L", "U", "D", "F", "B"];
        const mods = ["", "'", "2"];
        let scramble = [], lastAxis = -1;
        for (let i = 0; i < 20; i++) {
          let mIdx, axis;
          do {
            mIdx = Math.floor(Math.random() * moves.length);
            axis = Math.floor(mIdx / 2);
          } while (axis === lastAxis);
          lastAxis = axis;
          scramble.push(moves[mIdx] + mods[Math.floor(Math.random() * mods.length)]);
        }
        return scramble.join(" ");
      } else if (currentEvent === '222') {
        const moves = ["R", "U", "F"];
        const mods = ["", "'", "2"];
        let scramble = [], lastMove = "";
        for (let i = 0; i < 10; i++) {
          let mv;
          do { mv = moves[Math.floor(Math.random() * moves.length)]; } while (mv === lastMove);
          lastMove = mv;
          scramble.push(mv + mods[Math.floor(Math.random() * mods.length)]);
        }
        return scramble.join(" ");
      } else if (currentEvent === 'pyram') {
        const moves = ["U", "L", "R", "B"];
        const mods = ["", "'"];
        const tips = ["u", "l", "r", "b"];
        let scramble = [];
        for (let i = 0; i < 8; i++) {
          scramble.push(moves[Math.floor(Math.random() * moves.length)] + mods[Math.floor(Math.random() * mods.length)]);
        }
        tips.forEach(t => {
          if (Math.random() > 0.5) scramble.push(t + (Math.random() > 0.5 ? "'" : ""));
        });
        return scramble.join(" ");
      } else if (currentEvent === 'skewb') {
        const moves = ["R", "L", "U", "B"];
        const mods = ["", "'"];
        let scramble = [];
        for (let i = 0; i < 9; i++) {
          scramble.push(moves[Math.floor(Math.random() * moves.length)] + mods[Math.floor(Math.random() * mods.length)]);
        }
        return scramble.join(" ");
      }
    }

    function newScramble() {
      scrambleDisplay.innerText = generateScramble();
    }

    function formatTime(ms, penalty = 0) {
      if (penalty === 'DNF') return 'DNF';
      let totalMs = ms + (penalty === 2 ? 2000 : 0);
      const seconds = Math.floor(totalMs / 1000);
      const remainderMs = Math.floor(totalMs % 1000);
      const minutes = Math.floor(seconds / 60);
      const displaySec = seconds % 60;

      let str = '';
      if (minutes > 0) {
        str = `${minutes}:${displaySec < 10 ? '0' : ''}${displaySec}.${remainderMs.toString().padStart(3, '0')}`;
      } else {
        str = `${displaySec}.${remainderMs.toString().padStart(3, '0')}`;
      }
      if (penalty === 2) str += ' (+2)';
      return str;
    }

    function startInspection() {
      state = 'INSPECTING';
      inspectionTimeLeft = 15;
      inspectionPenalty = 0;
      inspectionStatus.innerText = 'INSPECTION';
      timerDisplay.innerText = '15';
      timerDisplay.className = 'timer-display inspecting';

      inspectionInterval = setInterval(() => {
        inspectionTimeLeft--;
        if (inspectionTimeLeft === 7) playBeep(800);
        if (inspectionTimeLeft === 3) playBeep(1000);

        if (inspectionTimeLeft > 0) {
          timerDisplay.innerText = inspectionTimeLeft;
        } else if (inspectionTimeLeft > -2) {
          inspectionPenalty = 2;
          inspectionStatus.innerText = '+2 SECONDS';
          timerDisplay.innerText = '+2';
        } else {
          inspectionPenalty = 'DNF';
          inspectionStatus.innerText = 'DNF';
          timerDisplay.innerText = 'DNF';
          clearInterval(inspectionInterval);
        }
      }, 1000);
    }

    function handleKeyDown() {
      if (resultModal.classList.contains('active') || manualModal.classList.contains('active')) return;

      if (state === 'RUNNING') {
        stopTimer();
        return;
      }

      if (state === 'IDLE') {
        if (inspectionEnabled) {
          startInspection();
        } else {
          state = 'HOLDING';
          timerDisplay.className = 'timer-display holding';
          holdingTimeout = setTimeout(() => {
            state = 'READY';
            timerDisplay.className = 'timer-display ready';
          }, 300);
        }
        return;
      }

      if (state === 'INSPECTING') {
        state = 'HOLDING';
        timerDisplay.className = 'timer-display holding';
        holdingTimeout = setTimeout(() => {
          state = 'READY';
          timerDisplay.className = 'timer-display ready';
        }, 300);
      }
    }

    function handleKeyUp() {
      if (resultModal.classList.contains('active') || manualModal.classList.contains('active')) return;

      if (state === 'HOLDING') {
        clearTimeout(holdingTimeout);
        state = inspectionEnabled ? 'INSPECTING' : 'IDLE';
        timerDisplay.className = inspectionEnabled ? 'timer-display inspecting' : 'timer-display';
      } else if (state === 'READY') {
        if (inspectionInterval) clearInterval(inspectionInterval);
        inspectionStatus.innerText = '';
        startTimer();
      }
    }

    function startTimer() {
      state = 'RUNNING';
      startTime = performance.now();
      timerDisplay.className = 'timer-display';
      timerInterval = setInterval(() => {
        currentRawTime = performance.now() - startTime;
        timerDisplay.innerText = formatTime(currentRawTime);
      }, 10);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      currentRawTime = performance.now() - startTime;
      
      const newSolve = {
        id: Date.now(),
        rawTime: currentRawTime,
        penalty: inspectionPenalty,
        scramble: scrambleDisplay.innerText
      };

      if (!allData[currentSession]) allData[currentSession] = [];
      allData[currentSession].unshift(newSolve);
      saveAndRender();
      
      state = 'IDLE';
      timerDisplay.innerText = '0.000';
      newScramble();
      
      openModal(newSolve);
    }

    // Modal Control
    function openModal(solve) {
      modalTime.innerText = formatTime(solve.rawTime, solve.penalty);
      modalScramble.innerText = solve.scramble;
      updateModalButtonsState();
      resultModal.classList.add('active');
    }

    function closeModal() { resultModal.classList.remove('active'); }

    function setModalPenalty(type) {
      let solves = allData[currentSession];
      if (solves.length === 0) return;
      solves[0].penalty = solves[0].penalty === type ? 0 : type;
      saveAndRender();
      modalTime.innerText = formatTime(solves[0].rawTime, solves[0].penalty);
      updateModalButtonsState();
    }

    function deleteModalSolve() {
      let solves = allData[currentSession];
      if (solves.length === 0) return;
      solves.shift();
      saveAndRender();
      closeModal();
    }

    function updateModalButtonsState() {
      let solves = allData[currentSession];
      if (solves.length === 0) return;
      const latest = solves[0];
      modalBtnPlus2.className = `modal-btn btn-plus2 ${latest.penalty === 2 ? 'active' : ''}`;
      modalBtnDNF.className = `modal-btn btn-dnf ${latest.penalty === 'DNF' ? 'active' : ''}`;
    }

    function togglePenalty(index, penaltyType) {
      let solves = allData[currentSession];
      solves[index].penalty = solves[index].penalty === penaltyType ? 0 : penaltyType;
      saveAndRender();
    }

    function removeSolve(index) {
      allData[currentSession].splice(index, 1);
      saveAndRender();
    }

    function clearHistory() {
      if (confirm(`Bạn có chắc muốn xóa sạch lịch sử của [${currentSession}]?`)) {
        allData[currentSession] = [];
        saveAndRender();
      }
    }

    // Manual Entry
    function openManualModal() {
      manualTimeInput.value = '';
      manualModal.classList.add('active');
      manualTimeInput.focus();
    }
    function closeManualModal() { manualModal.classList.remove('active'); }

    function submitManualSolve() {
      let val = manualTimeInput.value.trim();
      let ms = 0;
      if (val.includes(':')) {
        let parts = val.split(':');
        ms = (parseInt(parts[0]) * 60 + parseFloat(parts[1])) * 1000;
      } else {
        ms = parseFloat(val) * 1000;
      }

      if (isNaN(ms) || ms <= 0) {
        alert("Thời gian không hợp lệ!");
        return;
      }

      const newSolve = {
        id: Date.now(),
        rawTime: ms,
        penalty: 0,
        scramble: scrambleDisplay.innerText
      };

      if (!allData[currentSession]) allData[currentSession] = [];
      allData[currentSession].unshift(newSolve);
      saveAndRender();
      closeManualModal();
      newScramble();
    }

    // Average Calculations (CStimer logic)
    function calculateAverage(solveGroup) {
      if (solveGroup.some(s => s.penalty === 'DNF')) {
        const dnfCount = solveGroup.filter(s => s.penalty === 'DNF').length;
        if (dnfCount > 1) return 'DNF';
      }
      const times = solveGroup.map(s => s.penalty === 'DNF' ? Infinity : s.rawTime + (s.penalty === 2 ? 2000 : 0));
      times.sort((a, b) => a - b);
      const trimmed = times.slice(1, -1);
      const sum = trimmed.reduce((acc, curr) => acc + curr, 0);
      return sum / trimmed.length;
    }

    function calculateMean(solveGroup) {
      if (solveGroup.some(s => s.penalty === 'DNF')) return 'DNF';
      const sum = solveGroup.reduce((acc, s) => acc + s.rawTime + (s.penalty === 2 ? 2000 : 0), 0);
      return sum / solveGroup.length;
    }

    function updateStats() {
      let solves = allData[currentSession] || [];
      historyTitle.innerText = `Lịch sử (${solves.length})`;
      document.getElementById('statCount').innerText = solves.length;

      const validSolves = solves.filter(s => s.penalty !== 'DNF');
      if (validSolves.length > 0) {
        const best = Math.min(...validSolves.map(s => s.rawTime + (s.penalty === 2 ? 2000 : 0)));
        document.getElementById('statPB').innerText = formatTime(best);
      } else {
        document.getElementById('statPB').innerText = '--';
      }

      document.getElementById('statAo5').innerText = solves.length >= 5 && typeof calculateAverage(solves.slice(0, 5)) === 'number' ? formatTime(calculateAverage(solves.slice(0, 5))) : (solves.length >= 5 ? 'DNF' : '--');
      document.getElementById('statAo12').innerText = solves.length >= 12 && typeof calculateAverage(solves.slice(0, 12)) === 'number' ? formatTime(calculateAverage(solves.slice(0, 12))) : (solves.length >= 12 ? 'DNF' : '--');
      document.getElementById('statAo50').innerText = solves.length >= 50 && typeof calculateAverage(solves.slice(0, 50)) === 'number' ? formatTime(calculateAverage(solves.slice(0, 50))) : (solves.length >= 50 ? 'DNF' : '--');
      
      document.getElementById('statMean').innerText = solves.length > 0 && typeof calculateMean(solves) === 'number' ? formatTime(calculateMean(solves)) : (solves.length > 0 ? 'DNF' : '--');
    }

    function renderHistory() {
      solvesList.innerHTML = '';
      let solves = allData[currentSession] || [];
      solves.forEach((solve, index) => {
        const item = document.createElement('div');
        item.className = 'solve-item';
        item.innerHTML = `
          <span class="solve-index">#${solves.length - index}</span>
          <span class="solve-time">${formatTime(solve.rawTime, solve.penalty)}</span>
          <div class="solve-actions">
            <button class="action-badge ${solve.penalty === 2 ? 'plus2-active' : ''}" onclick="togglePenalty(${index}, 2)">+2</button>
            <button class="action-badge ${solve.penalty === 'DNF' ? 'dnf-active' : ''}" onclick="togglePenalty(${index}, 'DNF')">DNF</button>
            <button class="remove-solve" onclick="removeSolve(${index})">✕</button>
          </div>
        `;
        solvesList.appendChild(item);
      });
    }

    function saveAndRender() {
      localStorage.setItem('cstimer_pro_data', JSON.stringify(allData));
      renderHistory();
      updateStats();
    }

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (resultModal.classList.contains('active')) {
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          closeModal();
        } else if (e.key === '2') {
          setModalPenalty(2);
        } else if (e.key.toLowerCase() === 'd') {
          setModalPenalty('DNF');
        } else if (e.code === 'Delete' || e.code === 'Backspace') {
          deleteModalSolve();
        }
        return;
      }

      if (manualModal.classList.contains('active')) return;

      if (e.code === 'Space' && !e.repeat) {
        e.preventDefault();
        handleKeyDown();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (resultModal.classList.contains('active') || manualModal.classList.contains('active')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        handleKeyUp();
      }
    });

    // Touch support for mobile/tablets
    const timerSection = document.getElementById('timerSection');
    timerSection.addEventListener('touchstart', (e) => {
      if (resultModal.classList.contains('active') || manualModal.classList.contains('active')) return;
      e.preventDefault();
      handleKeyDown();
    }, { passive: false });

    timerSection.addEventListener('touchend', (e) => {
      if (resultModal.classList.contains('active') || manualModal.classList.contains('active')) return;
      e.preventDefault();
      handleKeyUp();
    }, { passive: false });

    // Init
    newScramble();
    saveAndRender();
  </script>
</body>
</html>
